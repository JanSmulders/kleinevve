# Cloudflare Worker voor Vera, de AI-assistent op vvekit.nl.
# De API-sleutel staat NIET hier: die zet u in het Cloudflare-dashboard als secret ANTHROPIC_API_KEY.
name = "kleinevve"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Welk Claude-model Vera gebruikt (keuze Jan 2026-10-11). Slimmer maar duurder: "claude-opus-5-5".
MODEL = "claude-haiku-5-5"
# Hoe diep het model nadenkt: low | medium | high. "low" is snel en zuinig.
EFFORT = "low"
# Alleen deze websites mogen Vera aanroepen.
ALLOWED_ORIGINS = "https://vvekit.nl,https://www.vvekit.nl,https://test.vvekit.nl,https://kleinevve.jansmulders1966.workers.dev,https://vvekit-test.pages.dev"
# Supabase-project van het portaal: Vera haalt een stuk alleen op met het token van de ingelogde gebruiker (RLS).
SUPABASE_URL = "https://nevkccqxidibpthxowyh.supabase.co"
SUPABASE_KEY = "sb_publishable_vP7uUh1wM9WoTkShwNsEWg_8ikU4UlC"
# Ontvangstdomein van Resend (team vvekit). ImprovMX stuurt VvE-mail ook naar <alias>@dit-domein, zodat Vera
# leden per mail kan antwoorden (route /inbound). Geen geheim: alleen mail van leden wordt beantwoord.
